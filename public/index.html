<style>

<header><h1><svg width="30" height="30" viewBox="0 0 28 28" fill="none" stroke="#9BE564" stroke-width="2" aria-hidden="true"><circle cx="14" cy="14" r="12"/><circle cx="10" cy="11" r="1" fill="#9BE564"/><circle cx="16" cy="10" r="1" fill="#9BE564"/><circle cx="13" cy="16" r="1" fill="#9BE564"/><circle cx="18" cy="16" r="1" fill="#9BE564"/></svg>MGA</h1><div class="row" id="yearBar"></div></header><nav id="nav"></nav><main id="app"></main><div id="msg"></div>
<script>
const TABS=[['board','Leaderboard'],['sched','Team Schedule'],['scores','Scorecard'],['hcp','Handicaps'],['ins','Insights'],['roster','Roster'],['course','Course'],['eoy','EOY Outing'],['playoffs','Playoffs'],['account','Account']];
const DEF=[4,4,3,5,4,4,3,4,5];
let S={teams:[],players:[],weeks:[],course:{par:[...DEF],hcp:[1,2,3,4,5,6,7,8,9]},years:[],activeYearId:null},tab='board',wk=null,db=null,tm,busy=0,fl=0,schedWarn=null,insWk=null,scEdit=new Set(),scFF=new Set(),addingYear=false;
function syncActiveYearIntoArchive(){const y=S.years.find(x=>x.id===S.activeYearId);

  const yr=(S.weeks&&S.weeks.length)?new Date([...S.weeks].sort((a,b)=>a.date<b.date?-1:1)[0].date).getFullYear():new Date().getFullYear();

  S.activeYearId=id}
 if(!S.activeYearId||!S.years.find(y=>y.id===S.activeYearId))S.activeYearId=S.years[0].id;
 const y=S.years.find(x=>x.id===S.activeYearId);
 Object.assign(S,{teams:y.teams,players:y.players,weeks:y.weeks,playoffs:y.playoffs||{seeds:[],links:{},overrides:{}},eoyGroups:y.eoyGroups||[],eoyGroupSize:y.eoyGroupSize||4});
 purgeUnassigned()}
function switchYear(yearId){if(!isCommish())return toast('Only the League Commissioner can change the League Year');if(yearId===S.activeYearId)return;
 syncActiveYearIntoArchive();

 wk=null;insWk=null;scEdit=new Set();scFF=new Set();schedWarn=null;addingYear=false;
 save();R()}
function newYear(){if(!isCommish())return toast('Only the League Commissioner can add a League Year');const label=($('nyLabel').value||'').trim();if(!label)return toast('Name the new League Year first');

 syncActiveYearIntoArchive();
 const idMap={};
 const teams=S.teams.map(t=>{const nid=uid();idMap[t.id]=nid;return{id:nid,name:t.name}});
 const players=S.players.map(p=>{const hc=c.cur[p.id];return{id:uid(),name:p.name,team:idMap[p.team]||'',email:p.email||'',phone:p.phone||'',hcp0:(hc!=null?hc:(p.hcp0||0)),role:p.role||'player',person:personOf(p)}});
 const newId=uid();
 S.years.push({id:newId,label,teams,players,weeks:[],playoffs:{seeds:[],links:{},overrides:{}},eoyGroups:[],eoyGroupSize:4});
 addingYear=false;S.activeYearId=newId;migrateAndActivate();
 wk=null;insWk=null;scEdit=new Set();scFF=new Set();schedWarn=null;
 save();R();toast(`Created ${label} — roster copied forward with handicaps carried over as starting points`)}
function deleteYear(yearId){if(!isCommish())return toast('Only the League Commissioner can delete a League Year');if(S.years.length<=1)return toast('You need at least one League Year — create a new one before deleting this.');
 const wasActive=yearId===S.activeYearId;
 S.years=S.years.filter(y=>y.id!==yearId);
 if(wasActive){S.activeYearId=S.years[S.years.length-1].id;migrateAndActivate();
  wk=null;insWk=null;scEdit=new Set();scFF=new Set();addingYear=false}
 save();R();toast('League Year deleted')}
function yearBarHTML(){const cur=S.years.find(y=>y.id===S.activeYearId);if(!loaded)return'';if(!isCommish())return`<b>League Year</b><span style="font:600 16px 'Space Grotesk',sans-serif">${esc(cur?cur.label:'—')}</span>`;
 let h=`<b>League Year</b><select onchange="switchYear(this.value)">${S.years.map(y=>`<option value="${y.id}" ${y.id==S.activeYearId?'selected':''}>${esc(y.label)}</option>`).join('')}</select><button onclick="addingYear=!addingYear;R()">${addingYear?'Cancel':'+ New Year'}</button>${S.years.length>1?`<button class="d" onclick="del(this,()=>deleteYear('${S.activeYearId}'))">Delete ${esc(cur?cur.label:'this year')}</button>`:''}`;
 if(addingYear)h+=`<input id="nyLabel" placeholder="e.g. 2027" style="width:100px"><button class="p" onclick="newYear()">Create (copies roster forward)</button>`;
 return h}
const $=id=>document.getElementById(id),sum=a=>a.reduce((x,y)=>x+y,0),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sg=n=>n>0?'+'+n:n===0?'E':String(n),f1=n=>(Math.round(n*10)/10).toFixed(1);
const to12h=(h,m)=>{const ap=h>=12?'PM':'AM';let hh=h%12;if(hh===0)hh=12;return hh+':'+String(m).padStart(2,'0')+' '+ap};
function roundRobin(teamIds){let teams=[...teamIds];if(teams.length%2)teams.push(null);
 const n=teams.length,half=n/2,rounds=n-1;let arr=teams.slice();const schedule=[];
 for(let r=0;r<rounds;r++){const pairs=[];for(let i=0;i<half;i++)pairs.push([arr[i],arr[n-1-i]]);
  schedule.push(pairs);const fixed=arr[0],rest=arr.slice(1);rest.unshift(rest.pop());arr=[fixed,...rest]}
 return schedule}
const fmtTee=v=>{if(typeof v==='number'&&isFinite(v)){const frac=v-Math.floor(v),tot=Math.round(frac*1440);return to12h(Math.floor(tot/60)%24,tot%60)}if(v instanceof Date&&!isNaN(v))return to12h(v.getUTCHours(),v.getUTCMinutes());return String(v??'').trim()};
const validYr=s=>{const y=+s.slice(0,4);return y>=2000&&y<=2100};
const normDate=v=>{let s=null;
 if(v instanceof Date){s=isNaN(v)?null:v.toISOString().slice(0,10)}
 else if(typeof v==='number'&&isFinite(v)){const d=new Date(Math.round((v-25569)*86400*1000));s=isNaN(d)?null:d.toISOString().slice(0,10)}
 else{const t=String(v||'').trim();if(t){if(/^\d{4}-\d{2}-\d{2}$/.test(t))s=t;else{const d=new Date(t);s=isNaN(d)?null:d.toISOString().slice(0,10)}}}
 return s&&validYr(s)?s:null};
const fmtDate=v=>{let s;if(v instanceof Date)s=isNaN(v)?'':v.toISOString().slice(0,10);else s=String(v??'').trim();
 if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return s||'(no date)';
 const d=new Date(s+'T00:00:00');return isNaN(d)?s:d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})};
function openPrint(html){const w=window.open('','_blank');if(!w)return toast('Your browser blocked the print window — allow pop-ups for this site and try again');w.document.open();w.document.write(html);w.document.close()}
function toast(t){const m=$('msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',3500)}
const API='/api';
let rev=0,myToken=localStorage.getItem('mga_token')||null,myPerson=localStorage.getItem('mga_person')||null,accounts=[],needsSetup=false,loaded=false;
const personOf=p=>p.person||p.id;
function me(){return myPerson?S.players.find(p=>personOf(p)===myPerson)||null:null}
function isCommish(){const m=me();return!!(m&&m.role=='commissioner')}
async function api(path,opts){opts=opts||{};opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});if(myToken)opts.headers.Authorization='Bearer '+myToken;
 const r=await fetch(API+path,opts);let d=null;try{d=await r.json()}catch(e){}
 if(!r.ok){const err=new Error((d&&d.error)||('Request failed ('+r.status+')'));err.status=r.status;err.data=d;throw err}
 return d}
function applyServer(d){rev=d.rev||0;accounts=d.accounts||[];needsSetup=!!d.needsSetup;loaded=true;
 if(d.state){S=Object.assign({teams:[],players:[],weeks:[],course:{par:[...DEF],hcp:[1,2,3,4,5,6,7,8,9]},years:[],activeYearId:null},d.state)}
 if(S.years&&S.years.length)migrateAndActivate()}
async function load(force){if(busy&&!force)return;
 try{const d=await api('/state');if(force||d.rev!==rev||!loaded){applyServer(d);if(force||!document.activeElement||!/INPUT|SELECT/.test(document.activeElement.tagName))R()}}
 catch(e){toast('Could not reach the league server: '+e.message)}}
function payload(){syncActiveYearIntoArchive();return{years:S.years,activeYearId:S.activeYearId,course:S.course}}
function save(){if(!myToken){toast('Sign in on the Account tab to make changes');load(true);return}
 busy=1;clearTimeout(tm);tm=setTimeout(async()=>{tm=0;fl=1;
 try{const d=await api('/state',{method:'POST',body:JSON.stringify({state:payload(),baseRev:rev})});rev=d.rev}
 catch(e){if(e.status==409)toast('Someone else saved at the same moment — your last change was not saved. Please redo it.');
  else if(e.status==401){toast('Your sign-in expired — please sign in again');doLogout(true)}
  else toast('Not saved: '+e.message);
  busy=0;fl=0;await load(true);return}
 finally{fl=0;setTimeout(()=>{if(!tm&&!fl)busy=0},800)}},400)}
const done=(w,id)=>{const h=(w.sc||{})[id];return h&&h.length==9&&h.every(v=>v!==''&&v!=null&&!isNaN(v))?h.map(Number):null};
const ws=()=>[...S.weeks].sort((a,b)=>a.date.localeCompare(b.date));
const H=d0=>d0.length?Math.min(18,Math.max(0,Math.round(sum(d0.slice(-5))/Math.min(d0.length,5)*.9))):null;
const Hp=(d,p)=>{const h=H(d);return h==null?Math.min(18,Math.max(0,Math.round(p.hcp0||0))):h};
const holeStrokes=(hcp,rank)=>{if(hcp==null)return 0;const hh=Math.max(0,hcp);return Math.floor(hh/9)+(rank<=(hh%9)?1:0)};
const siRanks=()=>{const idx=S.course.hcp.map((_,i)=>i).sort((a,b)=>S.course.hcp[a]-S.course.hcp[b]);const rk=Array(9);idx.forEach((h,r)=>rk[h]=r+1);return rk};
function calc(){const hist={},res={},hb={};
 const poWeeks=new Set(Object.values((S.playoffs&&S.playoffs.links)||{}).map(l=>l.weekId));
 for(const w of ws()){res[w.id]={};hb[w.id]={};const par=sum(S.course.par);
  for(const p of S.players){const d=hist[p.id]||(hist[p.id]=[]);const b=Hp(d,p);hb[w.id][p.id]=b;const h=done(w,p.id);if(!h)continue;const g=sum(h);res[w.id][p.id]={g,hc:b,n:g-b,h,pr:S.course.par,par};if(!poWeeks.has(w.id))d.push(g-par)}}
 const cur={};S.players.forEach(p=>{cur[p.id]=Hp(hist[p.id]||[],p)});return{res,hb,cur,hist}}
const tnet=(c,w,t)=>{const r=c.res[w.id],ps=S.players.filter(p=>p.team==t.id&&r[p.id]);return ps.length?sum(ps.map(p=>r[p.id].n-r[p.id].par)):null};
const tname=id=>(S.teams.find(t=>t.id==id)||{name:'No team'}).name,pname=id=>(S.players.find(p=>p.id==id)||{name:'?'}).name;
const matches=w=>w.matchups||[],pairsOf=(w,mid)=>(w.pairs||[]).filter(p=>p.m==mid),teamPlayers=id=>S.players.filter(p=>(p.team||'')==id);
function teamMatchNet(c,w,tid,m){const pr=pairsOf(w,m.id);let ids;if(pr.length)ids=pr.flatMap(p=>[p.pa,p.pb]).filter(id=>id&&(S.players.find(x=>x.id==id)||{}).team==tid);else ids=teamPlayers(tid).map(p=>p.id);const r=c.res[w.id],vs=ids.map(id=>r[id]).filter(Boolean);return vs.length?sum(vs.map(v=>v.n)):null}
function matchResult(c,w,m){const na=teamMatchNet(c,w,m.a,m),nb=teamMatchNet(c,w,m.b,m);if(na==null||nb==null)return null;if(na<nb)return{a:2,b:0};if(na>nb)return{a:0,b:2};return{a:1,b:1}}
function teamBlock(t,mid,excl){const ps=teamPlayers(t.id).filter(p=>!excl||!excl.has(p.id));if(!ps.length)return'';const lbl=excl?'Other net':'Team net';let h=`<tr class="t"><td colspan="10">${esc(t.name)}</td><td class="n" colspan="2">${lbl}: <span id="tt${t.id}${mid||''}"></span></td></tr>`;
 for(const p of ps){const w2=S.weeks.find(x=>x.id==wk),s=(w2.sc||{})[p.id]||[];h+=`<tr><td>${esc(p.name)}</td>${DEF.map((_,i)=>`<td class="n"><input class="h" type="number" min="1" max="15" value="${s[i]??''}" oninput="setSc('${p.id}',${i},this.value)"></td>`).join('')}<td class="n" id="t${p.id}"></td><td class="n" id="h${p.id}"></td><td class="n" id="n${p.id}"></td></tr>
  <tr class="mu"><td style="font-size:11px;padding-top:0">net</td>${DEF.map((_,i)=>`<td class="n" id="pn${p.id}_${i}" style="font-size:11px;padding-top:0"></td>`).join('')}<td colspan="3"></td></tr>`}
 return h}
function pairCalc(c,w,m){const rk=siRanks(),pairs=pairsOf(w,m.id).filter(p=>p.pa&&p.pb),res=[];
 pairs.forEach(p=>{const hcpA=c.hb[w.id][p.pa],hcpB=c.hb[w.id][p.pb],diff=Math.abs(hcpA-hcpB),higher=hcpA>hcpB?'a':hcpB>hcpA?'b':null;
  const ra=c.res[w.id][p.pa],rb=c.res[w.id][p.pb];
  if(!ra||!rb){res.push({pair:p,ready:false,diff,higher});return}
  const netA=[],netB=[];let wa=0,wb=0;
  for(let i=0;i<9;i++){const sA=higher=='a'?holeStrokes(diff,rk[i]):0,sB=higher=='b'?holeStrokes(diff,rk[i]):0;
   const na=ra.h[i]-sA,nb=rb.h[i]-sB;netA.push(na);netB.push(nb);if(na<nb)wa++;else if(nb<na)wb++}
  const pt=wa>wb?[1,0]:wb>wa?[0,1]:[0.5,0.5];
  res.push({pair:p,ready:true,netA,netB,higher,diff,pt})});
 const ready=res.filter(x=>x.ready);
 let teamPt=null,tSumA=Array(9).fill(0),tSumB=Array(9).fill(0);
 if(ready.length){let twa=0,twb=0;
  for(let i=0;i<9;i++){tSumA[i]=Math.min(...ready.map(x=>x.netA[i]));tSumB[i]=Math.min(...ready.map(x=>x.netB[i]));if(tSumA[i]<tSumB[i])twa++;else if(tSumB[i]<tSumA[i])twb++}
  teamPt=twa>twb?[1,0]:twb>twa?[0,1]:[0.5,0.5]}
 const totA=sum(res.map(x=>x.ready?x.pt[0]:0))+(teamPt?teamPt[0]:0),totB=sum(res.map(x=>x.ready?x.pt[1]:0))+(teamPt?teamPt[1]:0);
 return{pairs:res,tSumA,tSumB,teamPt,totA,totB,ready:ready.length>0}}
const TEAM_FMT={Scramble:4,'Alternate Shot':2};
function scrambleCalc(c,w,m){const scrA=(m.scrA||[]).filter(Boolean),scrB=(m.scrB||[]).filter(Boolean),div=TEAM_FMT[w.type]||4;
 let hcpA=null,hcpB=null,diff=null,higher=null;
 if(scrA.length==2&&scrB.length==2){hcpA=Math.round((c.hb[w.id][scrA[0]]+c.hb[w.id][scrA[1]])/div);hcpB=Math.round((c.hb[w.id][scrB[0]]+c.hb[w.id][scrB[1]])/div);
  diff=Math.abs(hcpA-hcpB);higher=hcpA>hcpB?'a':hcpB>hcpA?'b':null}
 const gA=m.scA||[],gB=m.scB||[];
 const doneA=gA.length==9&&gA.every(v=>v!==''&&v!=null&&!isNaN(v)),doneB=gB.length==9&&gB.every(v=>v!==''&&v!=null&&!isNaN(v));
 const gTotA=doneA?sum(gA.map(Number)):null,gTotB=doneB?sum(gB.map(Number)):null;
 let netA=null,netB=null,totA=null,totB=null,pts=null;
 if(hcpA!=null&&doneA&&doneB){const rk=siRanks();netA=[];netB=[];
  for(let i=0;i<9;i++){const sA=higher=='a'?holeStrokes(diff,rk[i]):0,sB=higher=='b'?holeStrokes(diff,rk[i]):0;netA.push(+gA[i]-sA);netB.push(+gB[i]-sB)}
  totA=sum(netA);totB=sum(netB);pts=totA<totB?[3,0]:totB<totA?[0,3]:[1.5,1.5]}

const ini=n=>(n||'?').split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,4);

   sc.forEach(s=>{const f=sc.findIndex(o=>o.net==s.net),k=sc.filter(o=>o.net==s.net).length;let p=0;for(let j=0;j<k;j++)p+=N-f-j;p/=k;const r=t[s.id];r.pts+=p;r.mw++;if(f==0)r.win++;if(wi==W.length-1)r.last=p})}

 const tot=S.players.length,totS=S.players.filter(p=>p.eoyScramble).length,totB=S.players.filter(p=>p.eoyBanquet).length;
 const stat=(label,n)=>`<div class="c" style="display:inline-block;padding:14px 20px;margin:0"><div class="mu" style="font-size:12px">${esc(label)}</div><div style="font:700 28px 'Space Grotesk',sans-serif">${n} / ${tot}</div><div class="mu" style="font-size:12px">${tot?Math.round(n/tot*100):0}% confirmed</div></div>`;
 let h=`<div class="c"><h2>RSVP summary</h2><div class="row">${stat('EOY Scramble',totS)}${stat('EOY Banquet',totB)}</div></div>`;
 h+=`<div class="c sc"><h2>By team</h2><table><tr><th>Team</th><th class="n">Scramble</th><th class="n">Banquet</th></tr>${S.teams.map(t=>{const ps=S.players.filter(p=>p.team==t.id),sC=ps.filter(p=>p.eoyScramble).length,bC=ps.filter(p=>p.eoyBanquet).length;return`<tr><td>${esc(t.name)}</td><td class="n">${sC}/${ps.length}</td><td class="n">${bC}/${ps.length}</td></tr>`}).join('')}</table></div>`;
 const grp=t=>{const ps=S.players.filter(p=>(p.team||'')==t.id);if(!ps.length)return'';
  return`<div class="c sc"><h2>${esc(t.name)}</h2><table style="table-layout:fixed"><colgroup><col><col style="width:130px"><col style="width:130px"></colgroup><tr><th>Player</th><th class="n">EOY Scramble</th><th class="n">EOY Banquet</th></tr>${ps.map(p=>`<tr><td>${esc(p.name)}</td><td class="n"><input type="checkbox" ${p.eoyScramble?'checked':''} onchange="setEOY('${p.id}','eoyScramble',this.checked)"></td><td class="n"><input type="checkbox" ${p.eoyBanquet?'checked':''} onchange="setEOY('${p.id}','eoyBanquet',this.checked)"></td></tr>`).join('')}</table></div>`};
 h+=S.teams.map(t=>grp(t)).join('')+grp({id:'',name:'No team'});
 h+=eoyGroupsV(c);
 return h}
function eoyGroupsV(c){const scr=S.eoyGroups||[];
 let h=`<div class="c"><h2>Scramble groups</h2><div class="row"><b>Group size</b><input id="eoyGroupSize" type="number" min="2" max="8" value="${S.eoyGroupSize||4}" style="width:60px"><button class="p" onclick="genGroups()">Generate groups</button>${scr.length?'<button onclick="printGroups()">🖨️ Print sign-in sheet</button><button class="d" onclick="del(this,()=>{S.eoyGroups=[];save();R()})">Clear groups</button>':''}</div><p class="mu" style="margin:0">Builds groups from players who\'ve checked EOY Scramble above, balanced by current handicap (or starting handicap if they haven\'t played yet) using a serpentine draft — lowest handicaps spread one per group first, so no single group is stacked. Re-generating replaces any existing groups.</p></div>`;
 if(!scr.length)return h;
 const allAssigned=scr.flatMap((g,gi)=>g.players.map(pid=>({pid,gi})));
 scr.forEach((g,gi)=>{
  h+=`<div class="c sc"><div class="row"><h2 style="margin:0">Group ${gi+1}</h2><input value="${esc(g.tee||'')}" placeholder="Tee time" style="width:120px" onchange="setGroupTee('${g.id}',this.value)"></div>
  <table><tr><th>Player</th><th class="n">Hcp</th><th>Swap with</th></tr>${g.players.map(pid=>{const p=S.players.find(x=>x.id==pid),hc=c.cur[pid]??'–';
   const opts=allAssigned.filter(x=>x.pid!=pid).map(x=>{const op=S.players.find(y=>y.id==x.pid);return`<option value="${x.pid}">Group ${x.gi+1} — ${esc(op?op.name:'?')}</option>`}).join('');
   return`<tr><td>${esc(p?p.name:'?')}</td><td class="n">${hc}</td><td><select onchange="if(this.value){swapPlayers('${pid}',this.value);this.value=''}"><option value="">— swap with —</option>${opts}</select></td></tr>`}).join('')}</table></div>`});
 return h}
function setGroupTee(gid,v){const g=(S.eoyGroups||[]).find(x=>x.id==gid);if(!g)return;g.tee=v.trim();save();R()}
async function printGroups(){const scr=S.eoyGroups||[];if(!scr.length)return;
 const teeMin=t=>{const mm=String(t||'').trim().match(/^(\d{1,2}):(\d{2})\s*([AaPp][Mm])?/);if(!mm)return 9999;let h=+mm[1],mi=+mm[2];const ap=(mm[3]||'').toUpperCase();if(ap=='PM'&&h!=12)h+=12;if(ap=='AM'&&h==12)h=0;return h*60+mi};
 const ordered=scr.map((g,i)=>({g,i})).sort((a,b)=>teeMin(a.g.tee)-teeMin(b.g.tee));
 const rows=ordered.map(({g,i})=>`<tr><td>${esc(g.tee||'—')}</td><td>Group ${i+1}: ${esc(g.players.map(pname).join(', '))}</td><td></td><td></td><td></td><td></td></tr>`).join('');
 const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Scramble groups sign-in sheet</title>
 <style>body{font:14px/1.4 Georgia,serif;color:#000;margin:30px}h1{font-size:22px;margin:0 0 2px}table{width:100%;border-collapse:collapse;margin-top:16px;table-layout:fixed}th,td{border:1px solid #000;padding:10px 8px;text-align:left;overflow-wrap:break-word}th{background:#eee;font-size:12px}col.tt{width:11%}col.mu2{width:37%}col.pl{width:13%}@media print{body{margin:0}}</style></head>
 <body><h1>EOY Scramble</h1><p style="margin:0;color:#333">Sign-in sheet</p>
 <table><colgroup><col class="tt"><col class="mu2"><col class="pl"><col class="pl"><col class="pl"><col class="pl"></colgroup><tr><th>Tee time</th><th>Group</th><th></th><th></th><th></th><th></th></tr>${rows}</table>
 <script>window.onload=()=>setTimeout(()=>window.print(),200)<\/script></body></html>`;
 openPrint(html)}
function swapPlayers(pidA,pidB){const groups=S.eoyGroups||[];let ga=null,ia=-1,gb=null,ib=-1;
 groups.forEach(g=>{const i=g.players.indexOf(pidA);if(i>=0){ga=g;ia=i}const j=g.players.indexOf(pidB);if(j>=0){gb=g;ib=j}});
 if(!ga||!gb)return;ga.players[ia]=pidB;gb.players[ib]=pidA;save();R()}
function genGroups(){const size=Math.max(2,Math.min(8,+($('eoyGroupSize').value)||4));S.eoyGroupSize=size;
 const c=calc(),elig=S.players.filter(p=>p.eoyScramble).sort((a,b)=>(c.cur[a.id]??a.hcp0??0)-(c.cur[b.id]??b.hcp0??0));
 if(!elig.length)return toast('No players have RSVPed yes for the Scramble yet');
 const nGroups=Math.max(1,Math.ceil(elig.length/size)),groups=Array.from({length:nGroups},()=>({id:uid(),tee:'',players:[]}));
 let idx=0,round=0;
 while(idx<elig.length){const order=[...Array(nGroups).keys()];if(round%2)order.reverse();
  for(const gi of order){if(idx>=elig.length)break;groups[gi].players.push(elig[idx].id);idx++}
  round++}
 S.eoyGroups=groups;save();R()}
function setEOY(id,k,v){const p=S.players.find(x=>x.id==id);if(!p)return;p[k]=v;save();R()}
function seedOrder(c){const t={};S.teams.forEach(x=>t[x.id]={id:x.id,pts:0,net:0,pw:0});
 ws().forEach(w=>{matches(w).forEach(m=>{
   if(TEAM_FMT[w.type]){const sc=scrambleCalc(c,w,m);if(sc.ready){t[m.a].pts+=sc.pts[0];t[m.b].pts+=sc.pts[1]}return}
   const pc=pairCalc(c,w,m);if(pc.pairs.some(x=>x.ready)){t[m.a].pts+=pc.totA;t[m.b].pts+=pc.totB}
  });
  S.teams.forEach(x=>{const rs=S.players.filter(p=>p.team==x.id).map(p=>c.res[w.id][p.id]).filter(Boolean);
   if(rs.length){t[x.id].net+=sum(rs.map(r=>r.n-r.par));t[x.id].pw++}})
 });
 return S.teams.map(x=>t[x.id]).sort((a,b)=>b.pts-a.pts||a.net-b.net)}
function matchPoints(c,w,m){
 if(m.forfeit){const win=m.forfeit.winner;
  if(win=='a')return{ready:true,a:3,b:0,forfeit:true};
  if(win=='b')return{ready:true,a:0,b:3,forfeit:true};
  return{ready:true,a:1.5,b:1.5,forfeit:true}}
 if(TEAM_FMT[w.type]){const sc=scrambleCalc(c,w,m);return{ready:sc.ready,a:sc.ready?sc.pts[0]:null,b:sc.ready?sc.pts[1]:null}}
 const pc=pairCalc(c,w,m),ready=pc.pairs.some(x=>x.ready);
 return{ready,a:ready?pc.totA:null,b:ready?pc.totB:null}}
const PO_SLOTS=[
 {id:'pi1',round:'Play-In',label:'Seed 7 vs Seed 10'},
 {id:'pi2',round:'Play-In',label:'Seed 8 vs Seed 9'},
 {id:'qf1',round:'Top 8',label:'Seed 1 vs winner of Seed 8/9'},
 {id:'qf2',round:'Top 8',label:'Seed 4 vs Seed 5'},
 {id:'qf3',round:'Top 8',label:'Seed 3 vs Seed 6'},
 {id:'qf4',round:'Top 8',label:'Seed 2 vs winner of Seed 7/10'},
 {id:'sf1',round:'Top 4',label:'Winner QF1 vs Winner QF2'},
 {id:'sf2',round:'Top 4',label:'Winner QF3 vs Winner QF4'},
 {id:'final',round:'Championship',label:'Winner SF1 vs Winner SF2'}];
function PO(){if(!S.playoffs)S.playoffs={seeds:[],links:{},overrides:{}};if(!S.playoffs.links)S.playoffs.links={};if(!S.playoffs.overrides)S.playoffs.overrides={};return S.playoffs}
function seedTeam(po,n){return po.seeds[n-1]}
function computeBracket(c){const po=PO(),w={},teamsFor={};let a,b;
 const get=id=>w[id];
 ['pi1','pi2','qf1','qf2','qf3','qf4','sf1','sf2','final'].forEach(id=>{
  if(id=='pi1'){a=seedTeam(po,7);b=seedTeam(po,10)}
  else if(id=='pi2'){a=seedTeam(po,8);b=seedTeam(po,9)}
  else if(id=='qf1'){a=seedTeam(po,1);b=get('pi2')}
  else if(id=='qf2'){a=seedTeam(po,4);b=seedTeam(po,5)}
  else if(id=='qf3'){a=seedTeam(po,3);b=seedTeam(po,6)}
  else if(id=='qf4'){a=seedTeam(po,2);b=get('pi1')}
  else if(id=='sf1'){a=get('qf1');b=get('qf2')}
  else if(id=='sf2'){a=get('qf3');b=get('qf4')}
  else if(id=='final'){a=get('sf1');b=get('sf2')}
  teamsFor[id]=[a,b];
  if(po.overrides[id]){w[id]=po.overrides[id];return}
  if(!a||!b)return;
  const link=po.links[id];if(!link)return;
  const wk=S.weeks.find(x=>x.id==link.weekId);if(!wk)return;
  const m=(wk.matchups||[]).find(x=>x.id==link.matchupId);if(!m)return;
  const mp=matchPoints(c,wk,m);if(!mp.ready)return;
  if(mp.a>mp.b)w[id]=a;else if(mp.b>mp.a)w[id]=b});
 return{winners:w,teamsFor}}
function genSeeds(){const c=calc(),ord=seedOrder(c);
 if(ord.length<10)return toast(`Need at least 10 teams for this format — you have ${ord.length}.`);
 const po=PO();po.seeds=ord.slice(0,10).map(x=>x.id);po.links={};po.overrides={};save();R()}
function moveSeed(i,dir){const po=PO(),j=i+dir;if(j<0||j>=po.seeds.length)return;const t=po.seeds[i];po.seeds[i]=po.seeds[j];po.seeds[j]=t;po.links={};po.overrides={};save();R()}
function unlinkSlot(slotId){const po=PO();delete po.links[slotId];save();R()}
function createAndLink(slotId,teamA,teamB){const d=$('po_date_'+slotId).value;if(!d)return toast('Pick a date first');
 const tee=$('po_tee_'+slotId).value.trim();
 let wk=S.weeks.find(x=>x.date==d);
 if(!wk){wk={id:uid(),date:d,type:'Regular',sc:{},matchups:[],pairs:[]};S.weeks.push(wk)}
 wk.matchups=wk.matchups||[];
 let m=wk.matchups.find(x=>(x.a==teamA&&x.b==teamB)||(x.a==teamB&&x.b==teamA));
 if(!m){m={id:uid(),a:teamA,b:teamB,tee};wk.matchups.push(m)}else if(tee)m.tee=tee;
 PO().links[slotId]={weekId:wk.id,matchupId:m.id};
 save();R();toast('Matchup scheduled and linked — set its format, tee time, and pairs on Team Schedule')}
function setOverride(slotId,teamId){const po=PO();po.overrides[slotId]=teamId;save();R()}
function clearOverride(slotId){const po=PO();delete po.overrides[slotId];save();R()}
function slotRow(slot,teamsFor,winners,c){const po=PO(),[a,b]=teamsFor[slot.id];
 if(!a||!b)return`<div class="c sc"><div class="mu">${esc(slot.round)}</div><div>${esc(slot.label)}</div><p class="mu" style="margin:4px 0 0">Waiting on earlier results.</p></div>`;
 const link=po.links[slot.id];
 let mp=null,wk=null;if(link){wk=S.weeks.find(x=>x.id==link.weekId);const m=wk?(wk.matchups||[]).find(x=>x.id==link.matchupId):null;if(wk&&m)mp=matchPoints(c,wk,m)}
 const winner=winners[slot.id],ov=po.overrides[slot.id],sa=po.seeds.indexOf(a)+1,sb=po.seeds.indexOf(b)+1;
 return`<div class="c sc"><div class="mu">${esc(slot.round)}</div>
  <div class="row" style="margin-bottom:6px"><b>Seed ${sa} ${esc(tname(a))} vs Seed ${sb} ${esc(tname(b))}</b></div>
  ${link?`<div class="row"><span class="mu">Scheduled for ${wk?esc(fmtDate(wk.date)):'a deleted week'}</span><button class="d" onclick="unlinkSlot('${slot.id}')">Unlink</button></div>`:
   `<div class="row"><b>Schedule this matchup</b><input type="date" id="po_date_${slot.id}"><input id="po_tee_${slot.id}" placeholder="Tee time (optional)" style="width:130px"><button class="p" onclick="createAndLink('${slot.id}','${a}','${b}')">Create & link</button></div>`}
  ${mp&&mp.ready?`<p style="margin:6px 0 0">Score: ${esc(tname(a))} ${f1(mp.a)} – ${f1(mp.b)} ${esc(tname(b))}</p>`:link?'<p class="mu" style="margin:6px 0 0">Linked — waiting on scores.</p>':''}
  ${winner?`<p style="margin:6px 0 0"><b>Winner: ${esc(tname(winner))}</b></p>${ov?`<button class="d" onclick="clearOverride('${slot.id}')">Clear manual winner</button>`:''}`:
   (mp&&mp.ready&&mp.a==mp.b)?`<div style="margin:6px 0 0"><p class="mu" style="margin:0 0 4px">Tied ${f1(mp.a)}–${f1(mp.b)} — pick a winner however your league resolves ties (a chip-off, a sudden-death hole, or a coin flip):</p><button onclick="setOverride('${slot.id}','${a}')">${esc(tname(a))}</button> <button onclick="setOverride('${slot.id}','${b}')">${esc(tname(b))}</button></div>`:''}
 </div>`}
function playoffsV(c){const po=PO();
 let h=(isCommish()?'':'<div class="c mu">View only — only the League Commissioner can change seeds, schedule playoff matches or pick winners.</div>')+`<div class="c"><h2>Seeding</h2><div class="row"><button class="p" onclick="genSeeds()">Generate seeds from standings</button>${po.seeds.length?'<button class="d" onclick="del(this,()=>{S.playoffs={seeds:[],links:{},overrides:{}};save();R()})">Reset playoffs</button>':''}</div><p class="mu" style="margin:0">Top 6 seeds qualify directly for the Top 8. Seeds 7–10 play in for the final two spots. Ties in the standings break by points, then net score vs par (lower is better) — reorder the seeds below if you\'d rather apply your own tiebreak.</p></div>`;
 if(po.seeds.length)h+=`<div class="c sc"><h2>Seeds</h2><table><tr><th class="n">Seed</th><th>Team</th><th></th></tr>${po.seeds.map((tid,i)=>`<tr><td class="n">${i+1}</td><td>${esc(tname(tid))}</td><td class="n">${i>0?`<button onclick="moveSeed(${i},-1)">▲</button>`:''} ${i<po.seeds.length-1?`<button onclick="moveSeed(${i},1)">▼</button>`:''}</td></tr>`).join('')}</table><p class="mu">Reordering resets any linked matchups and manually-picked winners below, since who\'s in each bracket slot would change.</p></div>`;
 if(po.seeds.length<10)return h+'<div class="c mu">Generate seeds once you have at least 10 teams to run the full play-in format.</div>';
 const{winners,teamsFor}=computeBracket(c);
 if(winners.final)h+=`<div class="c" style="text-align:center"><div class="mu">🏆 League Champion</div><div style="font:700 26px 'Space Grotesk',sans-serif">${esc(tname(winners.final))}</div></div>`;
 PO_SLOTS.forEach(s=>h+=slotRow(s,teamsFor,winners,c));
 return h}

function accountV(){

 <div class="row"><input id="bs_name" placeholder="Your name"><input id="bs_team" placeholder="Your team name"><input id="bs_year" placeholder="League Year, e.g. ${new Date().getFullYear()}" value="${new Date().getFullYear()}"></div>
 <div class="row"><input id="bs_pin" type="password" placeholder="Choose a PIN (6+ characters)"><input id="bs_pin2" type="password" placeholder="Repeat PIN"><input id="bs_code" type="password" placeholder="Setup code"><button class="p" onclick="doBootstrap()">Create league</button></div></div>`;

 return h}
