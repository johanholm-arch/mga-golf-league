<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>League</title>
<link rel="stylesheet" href="css/app.css">
<script>
// Apply the saved theme and text size before the page paints, so nothing flashes.
(function () { var t = localStorage.getItem('mga_theme'); if (t) document.documentElement.dataset.theme = t; var s = localStorage.getItem('mga_size'); if (s) document.documentElement.dataset.size = s; })();
</script>
</head>
<body>
<a class="skip" href="#app">Skip to content</a>
<header id="hdr">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="14" cy="14" r="12"/><circle cx="10" cy="11" r="1.2" fill="currentColor"/><circle cx="16" cy="10" r="1.2" fill="currentColor"/><circle cx="13" cy="16" r="1.2" fill="currentColor"/><circle cx="18" cy="16" r="1.2" fill="currentColor"/></svg>
    <div><h1 id="leagueName">League</h1><div id="yearLine" class="muted"></div></div>
  </div>
  <div id="who" class="who"></div>
</header>
<nav id="nav" aria-label="Sections"></nav>
<main id="app">
  <div id="err" class="banner" hidden role="alert"><span id="errText"></span><button class="btn small" data-act="dismissError">Dismiss</button></div>
  <div id="view"></div>
</main>
<nav id="bar" class="bar" aria-label="Sections"></nav>
<div id="toast" class="toast" aria-live="polite"></div>
<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <p id="dlgText"></p>
  <div class="row end"><button id="dlgCancel" class="btn">Cancel</button><button id="dlgOk" class="btn primary">OK</button></div>
</dialog>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
